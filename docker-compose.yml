# 一键启动：cp .env.example .env && 填好密钥 && docker compose up -d --build
# 本地大模型（可选）：docker compose --profile local-llm up -d
name: silkroad

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://silkroad:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/silkroad
    REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
    TASK_MODE: arq

services:
  api:
    build: ./backend
    <<: *backend-env
    ports: ["127.0.0.1:8000:8000"]
    volumes: [storage:/data/storage]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  worker:
    build: ./backend
    <<: *backend-env
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    volumes: [storage:/data/storage]
    depends_on:
      api: {condition: service_healthy}  # 等 api 建好表再启动，避免并发建表
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck: {disable: true}
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: silkroad
      POSTGRES_DB: silkroad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silkroad -d silkroad"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

volumes: {storage: {}, pgdata: {}, redisdata: {}, ollama: {}}
