              schema:
                type: object
                required: [tampered_id]
                properties: { tampered_id: { type: string, format: uuid } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /demo/audit/restore:
    post:
      tags: [demo]
      summary: 【仅 DEMO_MODE】把被篡改的审计日志恢复原样，哈希链重新校验通过
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemoAuditTarget' }
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: 已恢复
          content:
            application/json:
              schema:
                type: object
                required: [restored_id]
                properties: { restored_id: { type: string, format: uuid } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    DocumentId: { name: document_id, in: path, required: true, schema: { type: string, format: uuid } }
    ReviewId: { name: review_id, in: path, required: true, schema: { type: string, format: uuid } }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: 取自 csrf_token Cookie（服务端 HMAC 绑定当前 access/refresh 会话）；Cookie 写请求都须携带，且 Origin（缺失时 Referer）须在 CORS_ORIGINS 白名单，缺失或不匹配返回 CSRF_FAILED
      schema: { type: string }

  responses:
    Unauthorized:
      description: 未登录或令牌无效/过期
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: 角色无权限，或 CSRF 校验失败（CSRF_FAILED）；都会写审计
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: 不存在或不在本租户（不区分，避免枚举）
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: 状态冲突（如未就绪、版本不一致、重名）
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationError:
      description: 参数校验失败
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PayloadTooLarge:
      description: 文件超过 10 MB 或 10 页
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UnsupportedMedia:
      description: 文件真实类型不是 PDF/PNG/JPEG
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: 触发限流或配额
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: 稳定的机器可读错误码，前端据此展示文案
          enum:
            - AUTH_INVALID_CREDENTIALS
            - AUTH_TOKEN_EXPIRED
            - AUTH_LOCKED
            - PERMISSION_DENIED
            - CSRF_FAILED
            - NOT_FOUND
            - VALIDATION_FAILED
            - FILE_TOO_LARGE
            - FILE_TYPE_UNSUPPORTED
            - DOCUMENT_NOT_READY
            - VERSION_CONFLICT
            - ALREADY_EXISTS
            - RATE_LIMITED
            - RATE_LIMIT_UNAVAILABLE
            - QUOTA_EXCEEDED
            - MODEL_UNAVAILABLE
            - INTERNAL_ERROR
        request_id: { type: string }
        errors:
          type: array
          description: 字段级校验错误
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    Role:
      type: string
      enum: [admin, reviewer, auditor]
    Language:
      type: string
      description: 报告与追问的回答语言（由 LLM 实时生成）；界面语言的中英切换由前端 i18n 负责，不走这里
      enum: [zh-CN, en, ru, vi, pt, ar]
      default: zh-CN
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2
      pattern: '^[A-Z]{2}$'
    DocType:
      type: string
      enum: [commercial_invoice, packing_list, certificate_of_origin, customs_declaration, bill_of_lading, unknown]
    DocumentStatus:
      type: string
      enum: [uploaded, ocr_running, extracting, ready, failed]
    RiskLevel:
      type: string
      enum: [pass, low, medium, high]
    DegradeLevel:
      type: string
      description: L0 正常；L1 已切换备用云端模型；L2 本地 LLM 离线模式；L3=规则引擎回退，未完成真实 LLM 验证（勿把 L3 理解成“已用本地模型完成推理”）
      enum: [L0, L1, L2, L3]

    SessionResponse:
      type: object
      description: 令牌只在 HttpOnly Cookie 里，响应体不含任何令牌
      required: [expires_in, user]
      properties:
        expires_in: { type: integer, description: 'access_token 剩余有效秒数' }
        user: { $ref: '#/components/schemas/CurrentUser' }
    User:
      type: object
      required: [id, username, role, disabled, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    CurrentUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [tenant_id, permissions]
          properties:
            tenant_id: { type: string, format: uuid }
            permissions:
              type: array
              description: 前端据此显示/隐藏入口；服务端仍会逐次校验
              items:
                type: string
                enum: [user:manage, document:upload, document:read, document:edit, document:delete, review:create, review:read, chat:write, audit:read_own_case, audit:read_all]

    Document:
      type: object
      required: [id, doc_type, filename, mime, size_bytes, status, created_at]
      properties:
        id: { type: string, format: uuid }
        doc_type: { $ref: '#/components/schemas/DocType' }
        filename: { type: string, description: '展示用文件名（已清洗）' }
        mime: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        size_bytes: { type: integer }
        pages: { type: [integer, 'null'] }
        sha256: { type: string }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error: { oneOf: [ { $ref: '#/components/schemas/Problem' }, { type: 'null' } ] }
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expire_at: { type: string, format: date-time, description: '到期自动删除' }

    BBox:
      type: array
      description: 归一化坐标 [x0, y0, x1, y1]，取值 0–1，左上角为原点
      minItems: 4
      maxItems: 4
      items: { type: number, minimum: 0, maximum: 1 }
    OcrBlock:
      type: object
      required: [id, page, text, bbox, confidence]
      properties:
        id: { type: string }
        page: { type: integer, minimum: 1 }
        text: { type: string }
        bbox: { $ref: '#/components/schemas/BBox' }
        confidence: { type: number, minimum: 0, maximum: 1 }
    ExtractedField:
      type: object
      required: [key, label, value, source]
      properties:
        key: { type: string, description: '如 invoice_no, hs_code, total_amount, currency, origin_country, consignee' }
        label: { type: string, description: '本地化展示名' }
        value: { type: [string, 'null'] }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        source_block_ids:
          type: array
          description: 该字段来自哪些 OCR 块
          items: { type: string }
        locations:
          type: array
          description: 字段在原件上的位置（可跨页），前端翻到对应页并高亮该区域
          items:
            type: object
            required: [page, bbox]
            properties:
              page: { type: integer, minimum: 1 }
              bbox: { $ref: '#/components/schemas/BBox' }
        masked: { type: boolean, description: '是否为敏感字段（展示时已部分打码）' }
        source: { type: string, enum: [llm, rule, manual] }
    Recognition:
      type: object
      required: [document_id, version, ocr, fields, models, security, degrade_level, degrade_status, llm_verified]
      properties:
        document_id: { type: string, format: uuid }
        version: { type: integer }
        doc_type: { $ref: '#/components/schemas/DocType' }
        language_detected: { type: string }
        degrade_level: { $ref: '#/components/schemas/DegradeLevel' }
        degrade_status:
          type: string
          description: 固定可读降级说明；L3 文案为「规则引擎回退，未完成真实 LLM 验证」
        llm_verified: { type: boolean, description: 'false 表示未完成真实 LLM 验证' }
        ocr:
          type: object
          required: [engine, blocks]
          properties:
            engine: { type: string, examples: [rapidocr-ppocrv4] }
            duration_ms: { type: integer }
            blocks:
              type: array
              items: { $ref: '#/components/schemas/OcrBlock' }
        fields:
          type: array
          items: { $ref: '#/components/schemas/ExtractedField' }
        security:
          $ref: '#/components/schemas/SecurityFlags'
        models:
          type: array
          items: { $ref: '#/components/schemas/ModelTrace' }
        aigc: { $ref: '#/components/schemas/AigcLabel' }

    RuleCitation:
      type: object
      required: [rule_id, source, article, excerpt, source_kind, source_kind_label, excerpt_kind, applicability]
      properties:
        rule_id: { type: string }
        source: { type: string, description: '规则出处，如某协定原产地规则' }
        jurisdiction: { type: string }
        article: { type: string, description: '条款号' }
        excerpt: { type: string, description: '短摘录或自写摘要，不保证适用于本票交易' }
        url: { type: [string, 'null'], format: uri }
        score: { type: number, description: '重排相关度' }
        corpus:
          type: string
          enum: [synthetic, public_verified]
          description: public_verified 仅表示公开出处核验，不表示适用或获准清关；缺失元数据按 synthetic
        source_kind:
          type: string
          enum: [synthetic, public]
          description: 前端徽章用固定字段；public=公开核验出处，synthetic=合成/未核验。展示文案见 source_kind_label
        source_kind_label:
          type: string
          description: 可直接展示；synthetic 固定为「合成规则 · 非真实合规结论」
        verified_at: { type: [string, 'null'], format: date, description: '公开条目人工核验日期' }
        effective_date: { type: [string, 'null'], format: date, description: '规则生效日（若有）' }
        version_date: { type: [string, 'null'], format: date, description: '前端版本/核验日期展示；优先 verified_at，否则 effective_date' }
        excerpt_kind:
          type: string
          enum: [summary, verbatim]
          description: summary=自写/摘录摘要，不得当作法规原文全文
        applicability:
          type: string
          enum: [unverified]
          description: 固定 unverified：公开出处不等于本票适用或合规已通过
    Finding:
      type: object
      required: [id, severity, category, title, message, determined_by, citations]
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, low, medium, high] }
        category: { type: string, enum: [missing_field, inconsistency, classification, origin, restricted_goods, sanctions, valuation, format, other] }
        title: { type: string }
        message: { type: string, description: '按请求语言生成的解释' }
        document_id: { type: [string, 'null'], format: uuid }
        field_keys:
          type: array
          items: { type: string }
        evidence_block_ids:
          type: array
          items: { type: string }
        suggestion: { type: [string, 'null'] }
        determined_by:
          type: string
          description: rule=确定性规则引擎；llm=模型推理；llm_unverified=引用校验未通过，需人工复核
          enum: [rule, llm, llm_unverified]
        citations:
          type: array
          items: { $ref: '#/components/schemas/RuleCitation' }
    ReviewSummary:
      type: object
      required: [id, status, destination_country, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, completed, failed] }
        risk_level: { oneOf: [ { $ref: '#/components/schemas/RiskLevel' }, { type: 'null' } ] }
        destination_country: { $ref: '#/components/schemas/CountryCode' }
        document_ids:
          type: array
          items: { type: string, format: uuid }
        finding_counts:
          type: object
          properties:
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            info: { type: integer }
        created_at: { type: string, format: date-time }
    Review:
      allOf:
        - $ref: '#/components/schemas/ReviewSummary'
        - type: object
          required: [language, findings, degrade_level, degrade_status, llm_verified, security]
          properties:
            origin_country: { oneOf: [ { $ref: '#/components/schemas/CountryCode' }, { type: 'null' } ] }
            language: { $ref: '#/components/schemas/Language' }
            progress:
              type: object
              description: 进行中时的步骤进度
              properties:
                step: { type: string, enum: [rules_engine, retrieval, reasoning, explaining] }
                percent: { type: integer, minimum: 0, maximum: 100 }
            summary: { type: [string, 'null'] }
            findings:
              type: array
              items: { $ref: '#/components/schemas/Finding' }
            degrade_level: { $ref: '#/components/schemas/DegradeLevel' }
            degrade_status:
              type: string
              description: 固定可读降级说明；L3 文案为「规则引擎回退，未完成真实 LLM 验证」
            llm_verified: { type: boolean, description: 'false 表示未完成真实 LLM 验证' }
            security: { $ref: '#/components/schemas/SecurityFlags' }
            models:
              type: array
              items: { $ref: '#/components/schemas/ModelTrace' }
            aigc: { $ref: '#/components/schemas/AigcLabel' }
            error: { oneOf: [ { $ref: '#/components/schemas/Problem' }, { type: 'null' } ] }
            completed_at: { type: [string, 'null'], format: date-time }

    ChatMessage:
      type: object
      required: [id, role, content, created_at, blocked]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/RuleCitation' }
        blocked: { type: boolean, description: '输入被安全检测拦截' }
        block_reason: { type: [string, 'null'], enum: [prompt_injection, jailbreak, out_of_scope, sensitive_data, null] }
        models:
          type: array
          items: { $ref: '#/components/schemas/ModelTrace' }
        aigc: { oneOf: [ { $ref: '#/components/schemas/AigcLabel' }, { type: 'null' } ] }
        created_at: { type: string, format: date-time }

    Rule:
      type: object
      required: [id, source, jurisdiction, article, title, text, corpus, source_kind, source_kind_label, excerpt_kind, applicability]
      properties:
        id: { type: string }
        source: { type: string }
        jurisdiction: { type: string }
        article: { type: string }
        title: { type: string }
        text: { type: string, description: '条目正文；公开规则为摘要，非法规原文全文' }
        url: { type: [string, 'null'], format: uri }
        effective_date: { type: [string, 'null'], format: date }
        corpus: { type: string, enum: [synthetic, public_verified], description: '无标记的旧规则保守按 synthetic' }
        verified_at: { type: [string, 'null'], format: date }
        verification_note: { type: [string, 'null'] }
        source_kind:
          type: string
          enum: [synthetic, public]
          description: 与引用 citations[].source_kind 同语义
        source_kind_label:
          type: string
          description: 可直接展示；synthetic 固定为「合成规则 · 非真实合规结论」
        version_date: { type: [string, 'null'], format: date, description: '优先 verified_at，否则 effective_date' }
        excerpt_kind:
          type: string
          enum: [summary, verbatim]
          description: summary=摘要，不得当作法规原文
        applicability:
          type: string
          enum: [unverified]
          description: 固定 unverified：公开出处不等于本票适用或合规已通过

    ModelTrace:
      type: object
      description: 一次模型调用的可公开轨迹（不含提示词原文）
      required: [category, provider, model, task, latency_ms, status]
      properties:
        category: { type: string, enum: [ocr, llm, embedding, reranker] }
        provider: { type: string, examples: [local, deepseek, dashscope, ollama] }
        model: { type: string }
        task: { type: string, enum: [ocr, field_extraction, rule_retrieval, rerank, compliance_reasoning, explanation, chat] }
        prompt_version: { type: [string, 'null'] }
        tokens_in: { type: [integer, 'null'] }
        tokens_out: { type: [integer, 'null'] }
        latency_ms: { type: integer }
        status: { type: string, enum: [ok, fallback, failed] }
    AigcLabel:
      type: object
      description: GB 45438-2025 人工智能生成合成内容标识
      required: [explicit_text, content_id, generator, generated_at]
      properties:
        explicit_text: { type: string, examples: ['本内容由人工智能生成，仅供参考，请以人工复核为准'] }
        content_id: { type: string }
        generator: { type: string }
        models:
          type: array
          items: { type: string }
        generated_at: { type: string, format: date-time }
    SecurityFlags:
      type: object
      description: 本次处理中的安全事件与来源标签；前端必须展示语料/检索标签及免责声明，不得把合成检查包装为真实合规结论
      required: [rule_corpus, rule_corpus_label, source_kind, source_kind_label, retrieval_mode, compliance_disclaimer]
      properties:
        rule_corpus:
          type: string
          enum: [synthetic, public_verified, mixed]
          description: Recognition=配置索引范围；Review=本次召回上下文与确定性发现的引用并集。public_verified 仅在非空且全部为核验公开出处时使用；混入合成或未核验即 mixed，仅合成或空集为 synthetic。queued/旧数据保守标 synthetic。
        rule_corpus_label: { type: string, minLength: 1, description: '界面可直接展示的中文语料标签' }
        source_kind:
          type: string
          enum: [synthetic, public]
          description: 报告级固定徽章字段。mixed/synthetic→synthetic；仅全部公开核验→public。前端按此显示「合成规则 · 非真实合规结论」
        source_kind_label:
          type: string
          minLength: 1
          description: 与 source_kind 对应的固定中文；synthetic 恒为「合成规则 · 非真实合规结论」
        retrieval_mode:
          type: string
          enum: [lightweight_hash, bge]
          description: lightweight_hash=特征哈希召回+词项重排（非 BGE）；bge=本地 BGE embedding 和 reranker
        compliance_disclaimer:
          type: string
          const: 自动审查仅供人工复核；合成或未核验语料不得作为清关或交易决定依据。
        pii_masked_count: { type: integer, description: '出域前脱敏的敏感项数量' }
        pii_types:
          type: array
          items: { type: string, enum: [person_name, phone, email, bank_account, address, id_number] }
        injection_detected: { type: boolean }
        injection_snippets:
          type: array
          description: 命中的可疑片段（截断展示）
          items: { type: string, maxLength: 200 }
        output_checks_passed: { type: boolean }
        invalid_citations_dropped: { type: integer }

    ModelChain:
      type: object
      required: [degrade_level, models]
      properties:
        degrade_level: { $ref: '#/components/schemas/DegradeLevel' }
        llm_provider_chain:
          type: array
          description: 当前生效的 LLM 降级顺序
          items: { type: string }
        models:
          type: array
          items:
            type: object
            required: [category, provider, model, deployment, stage, healthy]
            allOf:
              - if:
                  properties:
                    category: { enum: [embedding, reranker] }
                then:
                  required: [lightweight, retrieval_mode, implementation_mode, mode_label]
            properties:
              category: { type: string, enum: [ocr, llm, embedding, reranker] }
              provider: { type: string }
              model: { type: string }
              deployment: { type: string, enum: [local, cloud] }
              stage: { type: string, description: '在链路中的环节' }
              healthy: { type: boolean }
              lightweight: { type: boolean, description: 'embedding/reranker 必填；true 表示非 BGE 轻量回退' }
              retrieval_mode: { type: string, enum: [lightweight_hash, bge] }
              implementation_mode: { type: string, enum: [lightweight_hash, lightweight_lexical, bge] }
              mode_label: { type: string, minLength: 1, description: 'embedding/reranker 中文模式标签，供界面展示' }
              configured_model: { type: string }
              heavy_load_failed: { type: boolean }
              circuit_open: { type: boolean }
              p95_latency_ms: { type: [integer, 'null'] }
              calls_24h: { type: integer }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, degraded, not_ready] }
        degrade_level: { $ref: '#/components/schemas/DegradeLevel' }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean }
              latency_ms: { type: [integer, 'null'] }
              detail: { type: [string, 'null'] }

