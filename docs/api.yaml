          application/json:
            schema: { $ref: '#/components/schemas/DemoAuditTarget' }
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: 已篡改
          content:
