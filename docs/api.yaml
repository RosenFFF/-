openapi: 3.1.0
info:
  title: 丝路智审 API
  version: 0.4.0
  description: |
    跨境贸易单证 AI 合规审查平台后端接口契约（M2，真实模型验收另行阻塞）。

    约定：
    - 基础路径 `/api/v1`；请求与响应均为 JSON（UTF-8），文件上传为 multipart。
    - 鉴权：登录后服务端下发三个 Cookie，前端 JS 拿不到令牌：
      - `access_token`：HttpOnly; Secure; SameSite=Strict; Path=/api，15 分钟。
      - `refresh_token`：HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth，7 天。签名的租户/用户/角色路由证明加随机 nonce，仅保存整串哈希；每次刷新轮换，旧令牌重放作废令牌族。旧不透明 Cookie 返回 401，须重新登录。
      - `csrf_token`：可读、非 HttpOnly; Secure; SameSite=Strict; Path=/。
      前端请求一律 `credentials: 'include'`；所有写请求（POST/PUT/PATCH/DELETE，登录除外）必须带请求头 `X-CSRF-Token`，值取自 `csrf_token` Cookie，不一致返回 403 `CSRF_FAILED`。
      服务间调用或脚本可改用 `Authorization: Bearer <access_token>`（此时不校验 CSRF）。
    - 租户上下文先于身份查询绑定；签名 tid/role 与数据库不一致或账号停用返回 401，不能把旧令牌搬到新组织。登录仅允许唯一 username 的受限凭证查询，未认证请求无业务查询权限。
    - 审计按租户独立链（共享物理表但不共享前驱）；平台无租户事件独立保存、不对组织暴露。旧共享链不自动重算或背书，历史切换须另行审核。
    - PostgreSQL API/worker 启动门禁仍强制阻止上线，须完成真实非 owner PostgreSQL 验证；SQLite/fakeredis 通过不等价于 RLS/模型验收。
    - 每个响应带 `X-Request-ID` 头，同时写进审计日志，前端报错时展示它便于排查。
    - 错误统一为 RFC 9457 `application/problem+json`，见 `Problem`。
    - 分页：`page`（从 1 开始）+ `page_size`（默认 20，最大 100）。
    - 时间为 ISO 8601 UTC；ID 为 UUID。
    - 写接口由 Redis 滑动窗口限流：登录按 IP，refresh/logout 按 IP；鉴权写入还有租户+用户总桶，上传/报告/追问（含 SSE 恢复）各有独立桶。超限 429 RATE_LIMITED + Retry-After；存储不可用 503 RATE_LIMIT_UNAVAILABLE，拒绝写入。
    - 输入注入检测、完整模型输出校验和 API 读取过滤是启发式纵深防护，不保证抵御任意混淆攻击；拒绝的报告输出只留显式 L3 规则回退，追问只返回 MODEL_UNAVAILABLE。
    - AI 生成内容都带 `aigc` 字段（GB 45438-2025 显式与隐式标识）。
servers:
  - url: /api/v1
tags:
  - name: system
  - name: auth
  - name: users
  - name: documents
  - name: reviews
  - name: chat
  - name: rules
  - name: audit
  - name: demo
    description: 仅 DEMO_MODE=true 时存在的演示端点
security:
  - accessCookie: []
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [system]
      summary: 存活检查
      security: []
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /readyz:
    get:
      tags: [system]
      summary: 就绪检查（依赖与模型状态）
      security: []
      responses:
        '200':
          description: 可以接流量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: 依赖未就绪
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /system/models:
    get:
      tags: [system]
      summary: 模型调用链路与健康状态（供现场核验）
      description: 列出系统集成的全部模型、在链路中的位置、当前是否可用与当前降级级别。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelChain' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/login:
    post:
      tags: [auth]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 8, maxLength: 128, format: password }
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '200':
          description: 登录成功；通过 Set-Cookie 下发 access_token、refresh_token、csrf_token，响应体不含令牌
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423':
          description: 连续失败过多，账号临时锁定
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: 用刷新令牌换新的会话 Cookie（刷新令牌同时轮换）
      description: 收到 401 后前端调用一次；仍 401 则跳登录页。需带 X-CSRF-Token。
      security:
        - refreshCookie: []
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK，重新下发三个 Cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 登出（作废整条刷新令牌族并清除 Cookie）
      security:
        - refreshCookie: []
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: '已登出' }
  /auth/me:
    get:
      tags: [auth]
      summary: 当前用户与权限
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [users]
      summary: 用户列表（admin）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      summary: 创建用户（admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string, minLength: 3, maxLength: 64, pattern: '^[a-zA-Z0-9_.-]+$' }
                password: { type: string, minLength: 12, maxLength: 128, format: password }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{user_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [users]
      summary: 修改角色或停用（admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: { $ref: '#/components/schemas/Role' }
                disabled: { type: boolean }
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents:
    post:
      tags: [documents]
      summary: 上传单证（admin, reviewer）
      description: |
        服务端按文件魔数校验真实类型（PDF/PNG/JPEG），≤10 MB、≤10 页。原件加密落盘后异步执行 OCR 与字段抽取，
        通过 `GET /documents/{id}` 轮询 `status`（建议 1 秒间隔）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                doc_type: { $ref: '#/components/schemas/DocType' }
            encoding:
              file:
                contentType: application/pdf, image/png, image/jpeg
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '202':
          description: 已接收，处理中
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [documents]
      summary: 单证列表（本租户内有权限的）
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DocumentStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      summary: 单证详情与处理状态
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [documents]
      summary: 删除单证（同时删除密文、识别结果和派生数据）
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: '已删除' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{document_id}/pages/{page}/image:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - { name: page, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [documents]
      summary: 获取某页渲染图（服务端解密后返回，用于识别结果对照）
      responses:
        '200':
          description: PNG 图片；带 Cache-Control no-store
          content:
            image/png:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{document_id}/recognition:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      summary: 识别结果（OCR 文本块 + 抽取字段）
      description: 文档状态为 `ready` 后可用；之前返回 409。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recognition' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /documents/{document_id}/fields:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    patch:
      tags: [documents]
      summary: 人工修正抽取字段（admin, reviewer）
      description: 用 `version` 做乐观锁；修改留审计，`source` 变为 `manual`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, fields]
              properties:
                version: { type: integer, minimum: 1 }
                fields:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string, maxLength: 64 }
                      value: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recognition' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reviews:
    post:
      tags: [reviews]
      summary: 发起合规审查（admin, reviewer）
      description: '可把同一票货的多份单证一起审（用于交叉核对发票、装箱单、原产地证）。异步执行，轮询 `GET /reviews/{id}`。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_ids, destination_country]
              properties:
                document_ids:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, format: uuid }
                origin_country: { $ref: '#/components/schemas/CountryCode' }
                destination_country: { $ref: '#/components/schemas/CountryCode' }
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '503':
          description: 限流存储不可用（RATE_LIMIT_UNAVAILABLE，拒绝写入）；模型路径也可能 MODEL_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '202':
          description: 已入队
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [reviews]
      summary: 审查列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: risk_level, in: query, schema: { $ref: '#/components/schemas/RiskLevel' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ReviewSummary' }
  /reviews/{review_id}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      tags: [reviews]
      summary: 审查报告（状态、风险分级、风险项与条款引用）
      parameters:
        - name: language
          in: query
          description: 目标契约为换语言查看；当前 M1b 不同于原语言时显式返回 501，不自动伪造翻译
          schema: { $ref: '#/components/schemas/Language' }
      responses:
        '501':
          description: 功能暂未实现（已有报告二次翻译），不会自动切 mock
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reviews/{review_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    get:
      tags: [chat]
      summary: 追问历史（review_read；可见性同审查）
      description: 用户与助手消息均持久化，按 created_at 升序。仅保存脱敏正文，不保存脱敏映射；无模型失败只留用户消息，不伪造助手消息。
      responses:
        '200':
          description: OK，尚无消息时 items 为空数组
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [chat]
      summary: 针对已完成报告追问（chat_write；admin, reviewer）
      description: |
        结合当前报告 summary/findings、最近 12 条未拦截历史和本地 RAG；出域前统一脱敏。
        `Accept: text/event-stream` 时 HTTP 200，成功事件依次为：
        - `delta`：`{"text": "..."}` 增量文字（每段最多 80 字符）
        - `citation`：`RuleCitation` 对象，只能引用本次召回且在 RuleIndex 存在的规则；provenance 与规则引用完全一致
        - `done`：完整的、已持久化的 `ChatMessage`
        - `error`：`Problem` 对象；无模型/超时/截断/不安全输出时 status=503, code=MODEL_UNAVAILABLE，然后结束，绝不发送成功 delta/citation/done
        上游为真实 OpenAI-compatible 流式调用；为阻止跨 token 的敏感信息泄露，整段回答先经输出与引用校验后再发送 SSE delta，因此不是实时首 token 透传。
        输入命中提示注入/越权意图检测时，HTTP 200 返回 blocked=true、含 block_reason 的消息并写审计，不调用 LLM；SSE 仅发送 blocked=true 的 done，没有 delta/citation。
        `Accept: application/json` 时一次性返回 ChatMessage；无可用模型等生成失败返回 HTTP 503 application/problem+json，不伪造规则回退答案。
        真实模型验收仍阻塞；fake/test-fixture-only 只在自动化测试注入，生产装配无 fake 开关。

        断线恢复：每个事件都有 id，格式为 `<stream UUID>:<递增序号>`，从 1 开始。
        响应头 X-Chat-Stream-ID 提供流 ID，首事件前断线可用该 ID 加 :0。
        后台生成与每次重放都继承并重新校验用户/租户/审查权限；账号停用或角色/组织变更时不再输出或保存答案。
        使用 fetch POST、同一 URL、相同 content/language、credentials 与 CSRF/Origin，并带 Last-Event-ID 从下一事件重放，然后继续跟随同一进行中的生成任务。
        恢复不会再调用模型或重复入库；同一流只允许原发起用户、租户与审查。完成后重放剩余事件；若 done/error 已确认，返回空 SSE（可有注释），不重复终态。
        不同问题/语言返回 409；无效/超前游标 422；不存在、过期或越权的流返回 404，此时读取历史，不得自动重发问题。
        Redis 回放默认保留最后一次事件后的 900 秒；连接每 10 秒可发注释心跳（不占事件 ID）。
        生成不随 HTTP 断开取消；API worker 异常退出没有持久化任务接管，最多生成时限+5秒后发 error，恢复不重新生成。正常关闭会取消任务并记 error；报告/单证删除清理历史与回放。
        默认每用户每分钟 20 次（包含恢复请求），生成总时限 90 秒，输出上限 12000 字符，可通过 Settings 调整。
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: Accept
          in: header
          schema: { type: string, enum: [application/json, text/event-stream], default: application/json }
        - name: Last-Event-ID
          in: header
          description: SSE 恢复游标；同一流的 UUID:已收到的递增序号，:0 从头重放。不得在 JSON 模式使用。
          schema: { type: string, pattern: '^[a-f0-9-]{36}:[0-9]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000, description: '不得全为空白' }
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '200':
          description: 生成或拦截结果；SSE 错误在 error 事件内（status=503），非成功结果
          headers:
            X-Chat-Stream-ID:
              description: 仅 SSE 响应；首事件前恢复使用此 ID 加 :0
              schema: { type: string, format: uuid }
          content:
            text/event-stream:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: JSON 模式未获得可用模型回答；MODEL_UNAVAILABLE，未完成真实/可用 LLM 验证
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /rules/{rule_id}:
    parameters:
      - { name: rule_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
    get:
      tags: [rules]
      summary: 规则详情（点击引用时展示；含 source_kind/version_date，公开条目为摘要）
      responses:
