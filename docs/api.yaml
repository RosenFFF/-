        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 按 seq 倒序分页，page_size ≤ 100；action/result/actor_id 精确匹配，since 含边界、until 不含。时间必须带时区且 since < until，否则 422。detail
        在写入和读取时脱敏；旧记录读取过滤不重写哈希。
  /audit/stats:
    get:
      tags:
      - audit
      summary: 本租户安全看板（admin/auditor）
      operationId: stats_api_v1_audit_stats_get
      security:
      - accessCookie: []
      - bearerAuth: []
      parameters:
      - name: window
        in: query
        required: false
        schema:
          enum:
          - 1h
          - 24h
          - 7d
          type: string
          default: 24h
          title: Window
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityStats'
        '422':
          description: 参数校验失败（RFC 9457）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 从真实已落库审计事件计算，不是 mock；requests 为事件数而非 HTTP 请求数。pii_masked 为类型计数之和，tokens_used 来自模型轨迹；时间桶为 UTC，1h/24h/7d 分别按5分钟/1小时/1天聚合。窗口外、其他租户和无租户事件不计入。window_start/window_end 表示统计窗口，generated_at 表示快照生成时间。
        auth_locked 是账号进入锁定状态的次数，不是锁定后的每次重试；model_errors 是失败调用事件数，fallback 另列。
        llm_verified 固定 false：本窗口未完成真实模型核对；source_kind=synthetic 保守包含来源未核验，不能把运行统计冒充真实模型验收。
